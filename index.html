<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of starred software repositories.">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Repository notebook</p>
        <h1>Stargazers log</h1>
        <p class="intro">A small, living list of software projects worth keeping an eye on.</p>
      </header>

      <section class="list-section" aria-labelledby="starred-heading">
        <div class="section-heading">
          <h2 id="starred-heading">Starred repositories</h2>
          <span id="repository-count" class="count" aria-live="polite"></span>
        </div>
        <div id="repository-list" class="repository-list" aria-live="polite">
          <p class="status">Loading repositories...</p>
        </div>
      </section>
    </main>

    <script src="script.js" defer></script>
  </body>
</html>
